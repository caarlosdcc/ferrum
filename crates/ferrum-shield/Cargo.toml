[package]
name = "ferrum-shield"
description = "Motor de políticas de privacidad y seguridad de Ferrum (independiente del motor web)"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
authors.workspace = true
repository.workspace = true
publish = false

[dependencies]
url.workspace = true
log.workspace = true
# Motor de reglas de Adblock Plus / uBlock Origin de Brave (MPL-2.0, como
# Ferrum). Sin `single-thread`: las reglas se compilan en otro hilo.
adblock = { version = "0.13", default-features = false, features = [
    "embedded-domain-resolver",
    "full-regex-handling",
] }

[lints]
workspace = true
