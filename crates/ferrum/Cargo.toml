[package]
name = "ferrum"
description = "Navegador web ligero, seguro y privado construido en Rust sobre Servo"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
authors.workspace = true
repository.workspace = true
publish = false

[dependencies]
ferrum-shield.workspace = true
url.workspace = true
log.workspace = true

# Motor web. Sin las funciones por defecto para no compilar el servidor de
# devtools (un puerto de depuración remota = superficie de ataque).
# WebGL, WebGPU y WebXR quedan fuera a propósito: menos huella digital
# (fingerprinting) y menos código expuesto a la web.
# `subtlecrypto` (Web Crypto, `crypto.subtle`) sí entra: sin él fallan inicios
# de sesión, llaves de acceso y apps con cifrado. Usa RustCrypto y aws-lc-rs.
servo = { version = "0.8", default-features = false, features = [
    "bundled",
    "clipboard",
    "js_jit",
    "multiprocess",
    "subtlecrypto",
] }

# Estas versiones deben coincidir con las que usa Servo, porque sus tipos
# aparecen en la API pública de Servo.
winit = "0.30"
euclid = "0.22"
dpi = "0.1"
keyboard-types = "0.8"
http = "1"
rustls = { version = "0.23", default-features = false, features = ["aws_lc_rs"] }

# Interfaz (pestañas, barra de direcciones, menús). Se dibuja en Rust, fuera del
# motor web: ninguna página puede leerla, taparla ni falsificarla.
# `glow` debe ser la misma versión que usa Servo para compartir el contexto OpenGL.
# Los iconos de la barra son vectoriales (src/gui/icons.rs); `monochrome_emoji_fonts`
# solo sirve para los títulos de páginas que llevan emojis.
egui = { version = "0.37", default-features = false, features = ["monochrome_emoji_fonts"] }
egui_glow = { version = "0.37", features = ["winit", "clipboard"] }
# Diálogo nativo del sistema para subir archivos (`<input type=file>`).
rfd = "0.18"

# Servidor MCP (`--mcp`): mensajes JSON y capturas en PNG. Servo ya compila las
# tres, así que no añaden código nuevo al binario; las versiones deben coincidir.
serde_json = "1"
base64 = "0.22"
image = { version = "0.25", default-features = false, features = ["png"] }

[build-dependencies]
# Icono y datos de versión dentro de ferrum.exe (solo se usa al compilar para Windows).
embed-resource = "3"

[lints]
workspace = true
